<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DompetKu — Manajemen Keuangan Pribadi</title>
  <meta name="description" content="Aplikasi manajemen keuangan pribadi: catat pemasukan, pengeluaran, budget kategori, grafik bulanan, target menabung. Bilingual ID/EN." />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16V7"/><circle cx="16.5" cy="14" r="1.2" fill="currentColor" stroke="none"/></svg></div>
        <div>
          <div class="brand-name">DompetKu</div>
          <div class="brand-sub" data-i18n="brand_sub">Keuangan Pribadi</div>
        </div>
      </div>
      <nav class="nav" id="main-nav">
        <a href="#/dashboard" class="nav-link" data-route="dashboard"><span class="nav-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span><span data-i18n="nav_dashboard">Dashboard</span></a>
        <a href="#/transaksi" class="nav-link" data-route="transaksi"><span class="nav-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></span><span data-i18n="nav_transaksi">Transaksi</span></a>
        <a href="#/kategori" class="nav-link" data-route="kategori"><span class="nav-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.3 9.3a1 1 0 0 0 1.4 0l8.6-8.6a1 1 0 0 0 0-1.4z"/><circle cx="7" cy="7" r="1.5"/></svg></span><span data-i18n="nav_kategori">Kategori & Budget</span></a>
        <a href="#/target" class="nav-link" data-route="target"><span class="nav-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></span><span data-i18n="nav_target">Target Menabung</span></a>
        <a href="#/pinjaman" class="nav-link" data-route="pinjaman"><span class="nav-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg></span><span data-i18n="nav_pinjaman">Hutang & Piutang</span></a>
        <a href="#/laporan" class="nav-link" data-route="laporan"><span class="nav-icon"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></span><span data-i18n="nav_laporan">Laporan</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="saldo-mini">
          <div class="saldo-mini-label" data-i18n="total_saldo">Total Saldo</div>
          <div class="saldo-mini-value" id="sidebar-saldo">Rp0</div>
        </div>
        <div class="sidebar-actions">
          <button class="btn btn-ghost btn-sm" id="btn-export-json" title="Export JSON"><svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg> JSON</button>
          <button class="btn btn-ghost btn-sm" id="btn-import-json" title="Import JSON"><svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg> JSON</button>
          <input type="file" id="import-json-file" accept="application/json" hidden />
        </div>
        <button class="btn btn-ghost btn-sm btn-block" id="btn-reset-demo"><svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg> <span data-i18n="reset_demo">Reset data demo</span></button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn hamburger" id="btn-hamburger" aria-label="menu"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <div class="topbar-right">
          <div class="lang-toggle" role="group" aria-label="language">
            <button id="lang-id" class="lang-btn">ID</button>
            <button id="lang-en" class="lang-btn">EN</button>
          </div>
          <button class="icon-btn" id="btn-theme" title="Dark/Light" aria-label="theme"></button>
          <button class="btn btn-primary" id="btn-quick-add"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> <span data-i18n="tambah_transaksi">Tambah Transaksi</span></button>
        </div>
      </header>
      <main class="content" id="app"><!-- views render di sini --></main>
      <footer class="footer">
        <span>DompetKu v1.0 • localStorage • Chart.js • </span><span data-i18n="footer">Dibuat untuk belajar manajemen keuangan</span>
      </footer>
    </div>
  </div>

  <!-- bottom nav mobile -->
  <nav class="bottom-nav" id="bottom-nav">
    <a href="#/dashboard" data-route="dashboard" aria-label="dashboard"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></a>
    <a href="#/transaksi" data-route="transaksi" aria-label="transaksi"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg></a>
    <a href="#/kategori" data-route="kategori" aria-label="kategori"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.3 9.3a1 1 0 0 0 1.4 0l8.6-8.6a1 1 0 0 0 0-1.4z"/><circle cx="7" cy="7" r="1.5"/></svg></a>
    <a href="#/target" data-route="target" aria-label="target"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></a>
    <a href="#/pinjaman" data-route="pinjaman" aria-label="pinjaman"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg></a>
    <a href="#/laporan" data-route="laporan" aria-label="laporan"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg></a>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
